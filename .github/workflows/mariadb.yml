name: MariaDB foundation
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP PDO
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql php-intl php-mbstring
      - name: PHP syntax
        run: find app public tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: A02 MariaDB schema and constraints
        env:
          HOTSPOT_TEST_DB_HOST: 127.0.0.1
          HOTSPOT_TEST_DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          HOTSPOT_TEST_DB_USER: root
        run: php tests/schema_mariadb.php
      - name: Administrative seed generator (offline)
        run: python3 tests/admin_seed_generator.py
      - name: A03 seed and 12 procedures through PDO
        env:
          HOTSPOT_TEST_DB_HOST: 127.0.0.1
          HOTSPOT_TEST_DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          HOTSPOT_TEST_DB_USER: root
        run: php tests/routines_mariadb.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mariadb-a02-a03-results
          path: tests/results/*.json
          if-no-files-found: warn
